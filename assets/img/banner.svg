<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f35;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2a44;stop-opacity:1" />
    </linearGradient>
    <!-- Orange accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e05a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f07840;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <!-- Soft circle gradient for nodes -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e05a1e;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#e05a1e;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4fa0e8;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#4fa0e8;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle radial background highlight -->
  <ellipse cx="600" cy="315" rx="550" ry="300" fill="rgba(255,255,255,0.015)"/>

  <!-- ── CONTINUUM DIAGRAM (right side) ─────────────────────────────── -->

  <!-- Connection lines between layers -->
  <!-- Edge → Cloud -->
  <line x1="850" y1="195" x2="960" y2="265" stroke="rgba(224,90,30,0.35)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="870" y1="205" x2="960" y2="295" stroke="rgba(79,160,232,0.2)" stroke-width="1" stroke-dasharray="4,5"/>
  <!-- Cloud → HPC -->
  <line x1="960" y1="305" x2="1050" y2="375" stroke="rgba(224,90,30,0.35)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="980" y1="285" x2="1050" y2="360" stroke="rgba(79,160,232,0.2)" stroke-width="1" stroke-dasharray="4,5"/>
  <!-- Agent hub lines -->
  <line x1="920" y1="315" x2="850" y2="190" stroke="rgba(79,160,232,0.3)" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="920" y1="315" x2="965" y2="280" stroke="rgba(79,160,232,0.3)" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="920" y1="315" x2="1050" y2="370" stroke="rgba(79,160,232,0.3)" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Edge node glow -->
  <circle cx="848" cy="188" r="32" fill="url(#nodeGlow)"/>
  <!-- Edge node -->
  <circle cx="848" cy="188" r="18" fill="rgba(20,45,75,0.95)" stroke="#e05a1e" stroke-width="2"/>
  <text x="848" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#e05a1e">EDGE</text>

  <!-- Cloud node glow -->
  <circle cx="968" cy="285" r="32" fill="url(#nodeGlow)"/>
  <!-- Cloud node -->
  <circle cx="968" cy="285" r="18" fill="rgba(20,45,75,0.95)" stroke="#e05a1e" stroke-width="2"/>
  <text x="968" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#e05a1e">CLOUD</text>

  <!-- HPC node glow -->
  <circle cx="1055" cy="375" r="32" fill="url(#nodeGlow)"/>
  <!-- HPC node -->
  <circle cx="1055" cy="375" r="18" fill="rgba(20,45,75,0.95)" stroke="#e05a1e" stroke-width="2"/>
  <text x="1055" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#e05a1e">HPC</text>

  <!-- Central agent hub glow -->
  <circle cx="920" cy="315" r="50" fill="url(#hubGlow)"/>
  <!-- Agent hub ring -->
  <circle cx="920" cy="315" r="32" fill="rgba(14,35,60,0.97)" stroke="#4fa0e8" stroke-width="2.5"/>
  <circle cx="920" cy="315" r="26" fill="none" stroke="rgba(79,160,232,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="920" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#4fa0e8">AGENT</text>
  <text x="920" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7ab8e8">AI</text>

  <!-- Continuum label -->
  <text x="940" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="2">EDGE – CLOUD – HPC CONTINUUM</text>

  <!-- Small data/tool icons around agent hub -->
  <!-- Data dots -->
  <circle cx="893" cy="295" r="3" fill="#4fa0e8" opacity="0.7"/>
  <circle cx="945" cy="295" r="3" fill="#4fa0e8" opacity="0.7"/>
  <circle cx="920" cy="348" r="3" fill="#4fa0e8" opacity="0.7"/>
  <circle cx="920" cy="283" r="3" fill="#4fa0e8" opacity="0.7"/>

  <!-- ── DIVIDER LINE ────────────────────────────────────────────────── -->
  <line x1="780" y1="80" x2="780" y2="550" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ── LEFT: TEXT CONTENT ─────────────────────────────────────────── -->

  <!-- Top badge -->
  <rect x="60" y="62" width="240" height="30" rx="15" fill="rgba(224,90,30,0.15)" stroke="rgba(224,90,30,0.5)" stroke-width="1.2"/>
  <text x="180" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#e05a1e" letter-spacing="1">IEEE eScience 2026 Workshop</text>

  <!-- AGENT4SC title -->
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="82" font-weight="900" fill="url(#accentGrad)" filter="url(#glow)" letter-spacing="-2">AGENT4SC</text>

  <!-- Year tag -->
  <text x="65" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.45)" letter-spacing="4">2026</text>

  <!-- Accent bar -->
  <rect x="60" y="228" width="80" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Subtitle line 1 -->
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#e8e8e8" letter-spacing="0.3">1st Workshop on Agentic AI</text>
  <!-- Subtitle line 2 -->
  <text x="60" y="308" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#e8e8e8" letter-spacing="0.3">for Large-scale Science</text>

  <!-- Tagline -->
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="13.5" fill="rgba(255,255,255,0.5)" letter-spacing="0.2">Autonomous · Trustworthy · Reproducible · Cross-Continuum</text>

  <!-- ── KEY DATES BOX ───────────────────────────────────────────────── -->
  <rect x="60" y="390" width="660" height="100" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Date items -->
  <!-- Papers Due -->
  <text x="120" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">PAPERS DUE</text>
  <text x="120" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e05a1e">Jul 21</text>
  <text x="120" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">2026</text>

  <!-- Separator -->
  <line x1="220" y1="410" x2="220" y2="470" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Notification -->
  <text x="320" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">NOTIFICATION</text>
  <text x="320" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e8e8e8">Aug 3</text>
  <text x="320" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">2026</text>

  <!-- Separator -->
  <line x1="420" y1="410" x2="420" y2="470" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Camera-ready -->
  <text x="520" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">CAMERA-READY</text>
  <text x="520" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e8e8e8">Aug 10</text>
  <text x="520" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">2026</text>

  <!-- Separator -->
  <line x1="620" y1="410" x2="620" y2="470" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Format -->
  <text x="675" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">FORMAT</text>
  <text x="675" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#e8e8e8">Half-Day</text>

  <!-- ── BOTTOM STRIP ───────────────────────────────────────────────── -->
  <rect x="0" y="555" width="1200" height="75" fill="rgba(10,25,45,0.6)"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="rgba(224,90,30,0.4)" stroke-width="1.5"/>

  <!-- Website -->
  <text x="60" y="598" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">agent4sc.github.io</text>
  <!-- Submission system -->
  <text x="300" y="598" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">Submit via EasyChair</text>
  <!-- Contact -->
  <text x="530" y="598" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.55)">agueroudji@anl.gov · souzar@ornl.gov</text>

  <!-- Right logo text -->
  <text x="1140" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="rgba(224,90,30,0.8)">AGENT4SC</text>
  <text x="1140" y="607" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">Agentic AI for Science</text>
</svg>
